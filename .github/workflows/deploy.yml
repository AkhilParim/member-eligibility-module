name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24.x'

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore
        working-directory: backend
      - run: dotnet build --no-restore -c Release
        working-directory: backend
      - run: dotnet publish -c Release -o ./publish
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: backend/publish

  migrate-database:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore
        working-directory: backend
      - run: dotnet tool restore
        working-directory: backend

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Open Postgres firewall for this runner
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          az postgres flexible-server firewall-rule create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --server-name "${{ secrets.AZURE_POSTGRES_SERVER_NAME }}" \
            --name "GitHubActionsRunner" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP"

      - name: Apply EF Core migrations
        # Program.cs requires ConnectionStrings:Default to be set just to boot
        # (used for design-time discovery by `dotnet ef`) — set it via the
        # standard ASP.NET Core env-var convention rather than appsettings.
        run: dotnet ef database update
        working-directory: backend
        env:
          ConnectionStrings__Default: ${{ secrets.MIGRATOR_DB_CONNECTION_STRING }}

      - name: Close Postgres firewall for this runner
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --server-name "${{ secrets.AZURE_POSTGRES_SERVER_NAME }}" \
            --name "GitHubActionsRunner" \
            --yes

  deploy-backend:
    runs-on: ubuntu-latest
    needs: migrate-database
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: publish

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Zip and deploy to App Service
        run: |
          cd publish
          zip -r ../publish.zip .
          cd ..
          az webapp deploy \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
            --src-path publish.zip \
            --type zip

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Bake the deployed API URL into the production build
        run: |
          sed -i "s|__API_BASE_URL__|${{ secrets.API_BASE_URL }}|" \
            src/environments/environment.production.ts
        working-directory: frontend

      - run: npx ng build
        working-directory: frontend

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist/frontend/browser
          skip_app_build: true
